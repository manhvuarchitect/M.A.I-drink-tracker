log_drink:
  name: Log Drink (Ghi nhận đồ uống)
  description: >
    Record a drink for a person. Target the device or
    one of its sensors.
  target:
    entity:
      integration: mai_tracker
  fields:
    loai:
      name: Loại đồ uống
      description: Loại đồ uống (nuoc_loc, cafe, tra, nuoc_ngot, sua, bia, ruou).
      required: true
      selector:
        text:
    luong_ml:
      name: Lượng (ml)
      description: Lượng đồ uống tính bằng ml.
      required: true
      selector:
        number:
          min: 1
          max: 2000
          step: 50
          unit_of_measurement: ml
    timestamp:
      name: Timestamp
      description: >
        Optional ISO 8601 datetime. Defaults to now.
      required: false
      selector:
        text:

remove_last_consumption:
  name: Remove Last Consumption
  description: Undo the most recent caffeine event for this person.
  target:
    entity:
      integration: mai_tracker

remove_consumption:
  name: Remove Consumption by ID
  description: Remove a specific caffeine event by its ID.
  target:
    entity:
      integration: mai_tracker
  fields:
    event_id:
      name: Event ID
      description: >
        The UUID of the event to remove. IDs are listed in the
        `events` attribute of the caffeine-level sensor.
      required: true
      selector:
        text:

clear_today:
  name: Clear Today
  description: Remove all caffeine events logged since local midnight.
  target:
    entity:
      integration: mai_tracker

log_medicine:
  name: Log Medicine (Ghi nhận uống thuốc)
  description: Record a medicine intake event.
  target:
    entity:
      integration: mai_tracker
  fields:
    name:
      name: Tên thuốc
      description: Tên loại thuốc đã uống.
      required: true
      selector:
        text:
    med_type:
      name: Nhóm thuốc
      description: Phân loại thuốc (iron, antibiotic, vitamin, general).
      required: false
      selector:
        select:
          options:
            - iron
            - antibiotic
            - vitamin
            - general
    reminder_time:
      name: Giờ nhắc nhở
      description: Thời gian nhắc nhở cữ tiếp theo (ISO 8601).
      required: false
      selector:
        text:
    timestamp:
      name: Timestamp
      description: Thời gian uống thuốc (ISO 8601). Mặc định là hiện tại.
      required: false
      selector:
        text:

speak:
  name: Phát thông báo ra loa (Speak Custom TTS)
  description: Phát câu thông báo tùy biến ra Loa phát thanh (TTS Speaker) đã cấu hình.
  target:
    entity:
      integration: mai_tracker
  fields:
    message:
      name: Nội dung phát loa
      description: Nội dung câu nói cần phát ra loa (để trống sẽ lấy từ ô nhập văn bản của người dùng).
      required: false
      selector:
        text:
